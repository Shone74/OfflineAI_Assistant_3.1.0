[project]
name = "OfflineAIAssistantFinal"
version = "3.1.0"
description = "Offline AI Assistant — final standalone application"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OfflineAI Team" }]

dependencies = [
    "PySide6>=6.6",
    "llama-cpp-python>=0.3.0",
    "scipy>=1.13.0",
    "pyttsx3>=2.91",
    "psutil>=5.9.0",
    "sounddevice>=0.5.0",
    "faster-whisper>=1.0.0",
    "nvidia-ml-py3>=12.465.0; platform_system == 'Windows'",
    "requests>=2.31.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.10",
]
voice = [
    "openwakeword>=0.6",
]
vector = [
    "faiss-cpu>=1.8; platform_system == 'Windows'",
    "sentence-transformers>=2.7",
]
scheduler = [
    "croniter>=2.0",
]

[project.scripts]
offline-ai-final = "app.application_final:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
